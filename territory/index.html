<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>区域割り当て管理</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>if (new URLSearchParams(location.search).get("embedded") === "1") document.documentElement.classList.add("is-embedded");</script>
<style>
  :root {
    --ink: #18181b; --ink2: #52525b; --ink3: #a1a1aa;
    --bg: #f4f4f5; --surface: #fff; --surface2: #fafafa;
    --border: #e4e4e7; --border2: #d4d4d8;
    --blue: #2563eb; --blue-l: #eff6ff; --blue-d: #1d4ed8;
    --green: #16a34a; --green-l: #f0fdf4;
    --amber: #d97706; --amber-l: #fffbeb;
    --red: #dc2626; --red-l: #fef2f2;
    --purple: #7c3aed; --purple-l: #f5f3ff;
    --teal: #0d9488; --teal-l: #f0fdfa;
    --stock: #52525b; --stock-l: #f4f4f5;
    --r: 8px; --r-lg: 12px;
    --sh: 0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.1);
    --sh-lg: 0 4px 6px rgba(0,0,0,.07), 0 10px 15px rgba(0,0,0,.1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e4e4e7; --ink2: #a1a1aa; --ink3: #71717a;
      --bg: #0f1115; --surface: #1a1d23; --surface2: #20242b;
      --border: #2c313a; --border2: #3a4049;
      --blue: #5b8def; --blue-l: #1b2a44; --blue-d: #7aa4f5;
      --green: #4ade80; --green-l: #14261c;
      --amber: #f0b429; --amber-l: #33280f;
      --red: #f87171; --red-l: #341717;
      --purple: #a78bfa; --purple-l: #251d3a;
      --teal: #2dd4bf; --teal-l: #102926;
      --stock: #a1a1aa; --stock-l: #24272e;
      --sh: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.35);
      --sh-lg: 0 4px 6px rgba(0,0,0,.35), 0 10px 15px rgba(0,0,0,.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ink: #e4e4e7; --ink2: #a1a1aa; --ink3: #71717a;
    --bg: #0f1115; --surface: #1a1d23; --surface2: #20242b;
    --border: #2c313a; --border2: #3a4049;
    --blue: #5b8def; --blue-l: #1b2a44; --blue-d: #7aa4f5;
    --green: #4ade80; --green-l: #14261c;
    --amber: #f0b429; --amber-l: #33280f;
    --red: #f87171; --red-l: #341717;
    --purple: #a78bfa; --purple-l: #251d3a;
    --teal: #2dd4bf; --teal-l: #102926;
    --stock: #a1a1aa; --stock-l: #24272e;
    --sh: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.35);
    --sh-lg: 0 4px 6px rgba(0,0,0,.35), 0 10px 15px rgba(0,0,0,.4);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.6;
  }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  button { font-family: inherit; }
  table { font-variant-numeric: tabular-nums; }
  input, select { font-family: inherit; }

  /* ---- header ---- */
  .hdr {
    height: 52px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .hdr-logo {
    width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--blue); color: #fff; font-size: 13px; font-weight: 800;
  }
  .hdr-titles { display: flex; flex-direction: column; gap: 0; margin-right: auto; }
  .hdr-eyebrow { font-size: 10px; letter-spacing: .06em; color: var(--ink3); }
  .hdr-name { font-size: 14px; font-weight: 700; color: var(--ink); }
  .hdr-stat {
    display: flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
    background: var(--surface2); color: var(--ink2); white-space: nowrap;
  }
  .hdr-stat b { color: var(--blue); font-weight: 800; }

  /* ---- layout ---- */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; align-items: start; }
  html.is-embedded, html.is-embedded body { height: auto; min-height: 100%; }
  html.is-embedded .hdr, html.is-embedded .sb { display: none; }
  html.is-embedded .layout { grid-template-columns: minmax(0, 1fr); }
  html.is-embedded main.cp { width: 100%; padding: 16px; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .sb { border-left: none; border-top: 1px solid var(--border); }
  }
  main.cp { padding: 26px; min-width: 0; }
  .sb {
    border-left: 1px solid var(--border);
    padding: 20px 16px;
    display: flex; flex-direction: column; gap: 18px;
    position: sticky; top: 68px;
    height: auto;
  }

  .plbl { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; color: var(--ink3); text-transform: uppercase; margin-bottom: 8px; padding: 0 2px; }
  .ag { display: flex; flex-direction: column; gap: 6px; }
  .abtn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 10px 10px;
    border: 1px solid var(--border); border-radius: var(--r-lg);
    background: var(--surface); cursor: pointer; text-align: left;
    font-family: inherit; color: inherit;
  }
  .abtn:hover { border-color: var(--border2); background: var(--surface2); }
  .abtn:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .ab-ic {
    width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .ab-tx { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
  .ab-n { font-size: 12.5px; font-weight: 700; color: var(--ink); }
  .ab-d { font-size: 11px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ab-ar { color: var(--ink3); font-size: 15px; flex-shrink: 0; }
  .sb-foot { font-size: 10.5px; color: var(--ink3); line-height: 1.7; padding: 0 2px; }
  .hdr-home { display:inline-flex; align-items:center; gap:5px; flex:none; padding:6px 9px; border:1px solid var(--border); border-radius:var(--r); background:var(--surface); color:var(--ink2); font-size:11px; font-weight:700; text-decoration:none; white-space:nowrap; }
  .hdr-home:hover { border-color:var(--blue); background:var(--blue-l); color:var(--blue); }
  .page-nav { display:flex; flex-direction:column; gap:12px; }
  .page-nav-group { display:flex; flex-direction:column; gap:5px; }
  .page-nav-group-title { padding:0 2px; color:var(--ink3); font-size:9px; font-weight:800; letter-spacing:.06em; }
  .page-nav-items { display:flex; flex-direction:column; gap:6px; }
  .abtn.active { border-color:var(--blue); background:var(--blue-l); }
  .area-page-nav { display:flex; align-items:flex-start; gap:10px; overflow-x:auto; margin:0 0 14px; padding:0 0 4px; }
  .area-page-nav-group { display:flex; flex-direction:column; gap:4px; flex:none; padding:0 1px; }
  .area-page-nav-label { padding:0 3px; color:var(--ink3); font-size:9px; font-weight:800; letter-spacing:.05em; white-space:nowrap; }
  .area-page-nav-items { display:flex; gap:5px; }
  .area-page-nav .btn { flex:none; }
  .area-page-nav .btn.active { background:var(--blue); border-color:var(--blue); color:#fff; }
  .area-page-body { padding:16px; }
  .area-back { border:0; background:none; color:var(--blue); font-family:inherit; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .area-page-summary { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:-6px 0 14px; }
  .area-page-summary span { display:inline-flex; align-items:center; gap:4px; padding:4px 8px; border:1px solid var(--border); border-radius:999px; background:var(--surface); color:var(--ink2); font-size:10px; font-weight:700; }
  .area-page-summary b { color:var(--blue); }
  .area-page-summary .pending b { color:var(--amber); }
  .area-dashboard-metrics .metric-pending { border-color:#fde68a; background:var(--amber-l); }
  .area-next-action { padding:14px 16px; border-color:#fde68a; }
  .area-next-action .section-title { margin-bottom:6px; }
  .area-next-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; align-items:center; gap:12px; width:100%; padding:10px 4px; border:0; border-top:1px solid var(--border); background:transparent; color:var(--ink); font:inherit; text-align:left; cursor:pointer; }
  .area-next-row:hover { background:var(--amber-l); }
  .area-next-id { font-size:12px; font-weight:800; }
  .area-next-copy b,.area-next-copy small { display:block; }
  .area-next-copy b { font-size:11px; }
  .area-next-copy small { margin-top:3px; color:var(--ink3); font-size:10px; }
  .area-next-link { color:var(--blue); font-size:10px; font-weight:700; white-space:nowrap; }
  .area-next-empty { padding:10px 3px; border-top:1px solid var(--border); color:var(--ink3); font-size:11px; }

  /* ---- dashboard ---- */
  .pagehead { margin-bottom: 18px; display: flex; flex-direction: column; gap: 3px; }
  .pagehead .eyebrow { font-size: 10.5px; letter-spacing: .06em; color: var(--blue); text-transform: uppercase; font-weight: 700; }
  .pagehead h1 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
  .pagehead p { margin: 1px 0 0; color: var(--ink2); font-size: 12.5px; max-width: 64ch; }

  .stack { display: flex; flex-direction: column; gap: 16px; }
  .grid { display: grid; gap: 12px; }
  .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 720px) { .grid.cols-4 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 720px) { .area-next-row { grid-template-columns:auto minmax(0,1fr) auto; gap:7px; } .area-next-row .chip { grid-column:2; grid-row:2; justify-self:start; } .area-next-link { grid-column:3; grid-row:1 / span 2; } }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-lg); padding: 14px 16px; box-shadow: var(--sh);
  }
  .tile { display: flex; flex-direction: column; gap: 5px; }
  .tile .tl { font-size: 10.5px; letter-spacing: .04em; color: var(--ink3); text-transform: uppercase; font-weight: 700; }
  .tile .tv { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
  .tile .ts { font-size: 11px; color: var(--ink3); }

  .section-title {
    font-size: 12px; font-weight: 800; letter-spacing: .01em; color: var(--ink);
    margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between;
  }

  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 100px; font-size: 11px; font-weight: 700; white-space: nowrap;
  }
  .chip.stock { background: var(--stock-l); color: var(--stock); }
  .chip.active { background: var(--blue-l); color: var(--blue); }
  .chip.pending { background: var(--amber-l); color: var(--amber); }
  .chip.good { background: var(--green-l); color: var(--green); }
  .chip.critical { background: var(--red-l); color: var(--red); }
  .chip.plain { background: var(--surface2); color: var(--ink3); border: 1px solid var(--border); }
  .assignment-edit-conflict { display: none; }
  .assignment-edit-conflict.show { display: inline-flex; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 8px 9px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink3); font-weight: 700; }
  tbody tr:hover { background: var(--surface2); }
  .table-wrap { overflow-x: auto; border-radius: var(--r); }
  .empty-note { color: var(--ink3); font-size: 12px; padding: 16px; text-align: center; }

  .pack {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 6px; background: var(--surface2);
    border: 1px solid var(--border); font-weight: 800; font-size: 11px; flex: none;
  }

  select, input[type="text"], input[type="date"], input[type="number"] {
    font-size: 12.5px; padding: 6px 8px; border-radius: var(--r);
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  }
  select:focus, input:focus, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .sm-only { display: none; }
  .inp-w60 { width: 60px; }
  .inp-w110 { width: 110px; }
  .inp-w120 { width: 120px; }
  .inp-w122 { width: 122px; }
  .inp-w160 { width: 160px; }
  label { font-size: 11px; color: var(--ink2); display: flex; flex-direction: column; gap: 3px; }
  .field-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }

  .banner {
    display: flex; gap: 9px; align-items: flex-start; padding: 10px 12px;
    border-radius: var(--r); background: var(--amber-l); color: var(--amber);
    font-size: 12px; border: 1px solid color-mix(in srgb, var(--amber) 35%, transparent);
  }
  .banner b { color: inherit; }
  .banner a { color: inherit; }

  /* ---- buttons ---- */
  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 12px; border-radius: var(--r); border: 1px solid var(--border);
    background: var(--surface); color: var(--ink); font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .btn:hover { border-color: var(--border2); }
  .btn-p { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn-p:hover { background: var(--blue-d); border-color: var(--blue-d); }
  .btn-g { background: var(--surface2); color: var(--ink2); }
  .btn-d { background: var(--red-l); color: var(--red); border-color: var(--red-l); }
  .btn-d:hover { border-color: var(--red); }
  .btn.small { padding: 4px 9px; font-size: 11.5px; }
  .btn[disabled] { opacity: .4; cursor: not-allowed; }

  /* ---- filter tabs (used inside modals) ---- */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  .tb {
    padding: 7px 11px; border: none; border-bottom: 2px solid transparent;
    background: none; font-family: inherit; font-size: 12px; font-weight: 600;
    cursor: pointer; color: var(--ink2);
  }
  .tb.on { color: var(--blue); border-bottom-color: var(--blue); font-weight: 700; }

  /* ---- modals ---- */
  .ov {
    display: none; position: fixed; inset: 0; background: rgba(15,17,21,.5);
    align-items: flex-start; justify-content: center; padding: 5vh 16px; z-index: 500; overflow-y: auto;
  }
  .ov.show { display: flex; }
  .ov.confirm-ov { z-index: 900; align-items: center; }
  .modal {
    background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-lg);
    width: 100%; max-width: 720px; display: flex; flex-direction: column; max-height: 90vh;
  }
  .modal.sm { max-width: 460px; }
  .confirm-msg { white-space: pre-wrap; font-size: 12.5px; color: var(--ink2); line-height: 1.7; margin: 0; }
  .mhd {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .mt { font-size: 14px; font-weight: 800; }
  .mx {
    border: none; background: none; cursor: pointer; color: var(--ink3);
    font-size: 15px; padding: 4px; line-height: 1; border-radius: 6px;
  }
  .mx:hover { background: var(--surface2); color: var(--ink); }
  .mbd { padding: 16px 18px; overflow-y: auto; }
  .mft {
    display: flex; align-items: center; justify-content: flex-end; gap: 8px;
    padding: 12px 18px; border-top: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap;
  }
  .mft.spread { justify-content: space-between; }

  .adj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 6px; }
  .adj-cell {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    padding: 7px 4px; border-radius: var(--r); border: 1px solid var(--border);
    font-size: 12px; cursor: pointer; user-select: none; background: var(--surface2);
  }
  .adj-cell.on { background: var(--blue-l); border-color: var(--blue); color: var(--blue); font-weight: 700; }
  .adj-cell.self { opacity: .3; cursor: default; }

  .proposal-card { background: var(--blue-l); border-color: color-mix(in srgb, var(--blue) 28%, var(--border)); }
  .proposal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .proposal-title { font-size: 12.5px; font-weight: 800; }
  .proposal-desc { margin: 2px 0 0; color: var(--ink2); font-size: 11.5px; }
  .proposal-list { display: flex; flex-direction: column; gap: 8px; }
  .proposal-row { padding: 9px 10px; border: 1px solid color-mix(in srgb, var(--blue) 18%, var(--border)); border-radius: var(--r); background: var(--surface); }
  .proposal-row-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .proposal-group { font-weight: 800; }
  .proposal-meta { color: var(--ink3); font-size: 11px; }
  .proposal-ids { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; color: var(--ink2); font-size: 11.5px; }
  .proposal-note { margin: 10px 0 0; color: var(--ink2); font-size: 11.5px; }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 100px;
    font-size: 12px; font-weight: 700; box-shadow: var(--sh-lg);
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 700;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  .offline-banner {
    display: none; position: sticky; top: 52px; z-index: 90;
    background: var(--amber-l); color: var(--amber);
    border-bottom: 1px solid color-mix(in srgb, var(--amber) 35%, transparent);
    padding: 8px 16px; font-size: 12px; font-weight: 700; text-align: center;
  }
  .offline-banner.show { display: block; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* PW_GWS共通ログインの確認が終わるまで、区域データを表示しない */
  html.area-auth-pending body > * { visibility: hidden; }
  html.area-auth-pending body::before {
    content: "認証を確認しています…";
    position: fixed; inset: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--ink2);
    font-size: 14px; font-weight: 700;
    visibility: visible;
  }
  @media (max-width:860px) {
    .layout { display:flex; flex-direction:column; }
    main.cp { width:100%; padding:16px; }
    .sb { order:-1; position:static; width:100%; height:auto; padding:10px 14px; border:0; border-bottom:1px solid var(--border); }
    .sb > div:first-child { min-width:0; }
    .sb .plbl { margin-bottom:5px; }
    .page-nav { flex-direction:row; overflow-x:auto; gap:10px; padding-bottom:3px; }
    .page-nav-group { flex:none; }
    .page-nav-group-title { display:none; }
    .page-nav-items { flex-direction:row; gap:6px; }
    .page-nav .abtn { width:auto; min-width:max-content; padding:7px 10px; }
    .page-nav .ab-d,.sb-foot { display:none; }
    .page-nav .ab-ic { width:25px; height:25px; }
  }
  @media (max-width:520px) {
    .hdr { gap:7px; padding:0 9px; }
    .hdr-home { width:30px; height:30px; justify-content:center; padding:0; font-size:18px; }
    .hdr-home span:last-child { display:none; }
    .hdr-stat { max-width:44vw; overflow:hidden; text-overflow:ellipsis; font-size:9px; padding:4px 7px; }
    main.cp { padding:14px 10px; }
    .area-page-body { padding:12px 9px; }
    .area-back { font-size:10px; }
    .area-page-nav { gap:8px; }
    .area-page-nav .btn { padding:6px 8px; font-size:10px; }
    .area-page-summary { gap:4px; }
    .area-page-summary span { padding:3px 6px; font-size:9px; }
  }
  /* ---- 画面が狭いとき：テーブルは横スクロールせずカードに積み上げる ---- */
  @media (max-width: 860px) {
    .table-wrap { overflow-x: visible; }
    .table-wrap table, .table-wrap tbody, .table-wrap tr, .table-wrap td { display: block; width: 100%; }
    .table-wrap thead { display: none; }
    .table-wrap tbody tr {
      border: 1px solid var(--border); border-radius: var(--r);
      background: var(--surface); padding: 8px 10px; margin-bottom: 8px;
    }
    .table-wrap tbody tr:last-child { margin-bottom: 0; }
    .table-wrap tbody tr:hover { background: var(--surface); }
    .table-wrap td {
      border-bottom: none; padding: 3px 0;
      display: flex; align-items: center; gap: 10px; justify-content: space-between;
    }
    .table-wrap td::before {
      content: attr(data-label);

<script>
(function () {
  "use strict";

  // admin / shift-form と同じセッションを使い、区域係の管理者だけを通す。
  // 権限はlocalStorageを信用せず、既存Supabase APIへ毎回確認する。
  window.areaAccessReady = (async function () {
    if (typeof pwgwsEnforceRelogin === "function" && pwgwsEnforceRelogin()) {
      if (typeof pwgwsGoToLogin === "function") pwgwsGoToLogin();
      return false;
    }

    var recoveryToken = typeof pwgwsGetRecoveryToken === "function" ? pwgwsGetRecoveryToken() : "";
    var session = typeof pwgwsGetSession === "function" ? pwgwsGetSession() : null;
    if (!recoveryToken && !session) {
      if (typeof pwgwsGoToLogin === "function") pwgwsGoToLogin();
      return false;
    }

    try {
      var auth = recoveryToken
        ? await apiPost({ action: "validateRecoverySession" })
        : await apiAuthGet("", "admin");
      if (!auth || !auth.ok || !auth.isAdmin) {
        if (typeof PWGWS_FORM_URL !== "undefined" && PWGWS_FORM_URL) {
          location.replace(PWGWS_FORM_URL);
        } else if (typeof pwgwsGoToLogin === "function") {
          pwgwsGoToLogin("区域係管理画面を利用する権限がありません。");
        }
        return false;
      }
      // area-auth-pending の解除は、区域データ本体の読み込み完了後（territory側のIIFE）まで遅らせる。
      // ここで先に解除すると、getTerritoryState の応答待ちの間、空の画面が一瞬見えてしまう。
      return true;
    } catch (e) {
      document.documentElement.classList.remove("area-auth-pending");
      document.body.innerHTML =
        '<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--ink);font-family:inherit">' +
        '<div style="max-width:420px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;box-shadow:var(--sh-lg)">' +
        '<h1 style="font-size:18px;margin:0 0 10px">認証を確認できませんでした</h1>' +
        '<p style="margin:0 0 16px;color:var(--ink2);font-size:13px">通信状態を確認して、もう一度お試しください。</p>' +
        '<button type="button" onclick="location.reload()" style="padding:9px 16px;border:0;border-radius:8px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer">再読み込み</button>' +
        '</div></main>';
      return false;
    }
  })();
})();
</script>
<script>
window.areaAccessReady.then(async function (areaAccessGranted) {
  if (!areaAccessGranted) return;
  await (async function () {
  "use strict";

  var STORAGE_KEY = "utazu-territory-app:v1";
  var TOTAL_TERRITORIES = 42;

  var PURPOSE_LABEL = { normal: "通常", joint: "合同奉仕", campaign: "キャンペーン確保" };

  // 2026-07-30時点で目視確認済みの隣接関係（利用者のバックアップデータより）。区域42（瀬居）は陸続きの隣接なし。
  var VERIFIED_ADJACENCY = {
    1: [2,3], 2: [1,3,4,5], 3: [1,2,5,6,8], 4: [2,5,9], 5: [2,3,4,6,7,9,15],
    6: [3,5,7,8], 7: [5,6,8,15], 8: [3,6,7,15,18], 9: [4,5,10,15], 10: [9,11,15],
    11: [10,12,13,14,15,16,17,27], 12: [11,13,14], 13: [11,12,14,32,33], 14: [11,12,13,38,39],
    15: [5,7,8,9,10,11,18], 16: [11,17,18,19,20,21], 17: [11,16,21,22,26], 18: [8,15,16,19],
    19: [16,18,20], 20: [16,19,21], 21: [16,17,20,22], 22: [17,21,23,24,26], 23: [22,24,25],
    24: [22,23,25,26,29,30], 25: [23,24,30,41], 26: [17,22,24,27,28,29], 27: [11,26,28,32],
    28: [26,27,29,30,31,32], 29: [24,26,28,30], 30: [24,25,28,29,31,41], 31: [28,30,32,41],
    32: [13,27,28,31,33,34], 33: [13,32,34,35], 34: [32,33,35], 35: [33,34,36,37],
    36: [35,37], 37: [35,36], 38: [14,39,40], 39: [14,38,40], 40: [38,39,41], 41: [25,30,31,40],
    42: []
  };

  function defaultState() {
    var groups = [
      { id: "g1", name: "青の山", targetActiveCount: 3 },
      { id: "g2", name: "川津", targetActiveCount: 3 },
      { id: "g3", name: "浜", targetActiveCount: 3 },
      { id: "g4", name: "瀬居", targetActiveCount: 3 }
    ];
    var territories = [];
    for (var i = 1; i <= TOTAL_TERRITORIES; i++) {
      territories.push({
        id: i, area: "", adjacentIds: (VERIFIED_ADJACENCY[i] || []).slice(), purpose: "normal", status: "stock",
        currentGroupId: null, assignedDate: null, dueDate: null, collectedDate: null,
        note: "", history: []
      });
    }
    return { groups: groups, territories: territories, setupDismissed: false };
  }

  function normalizeState(input) {
    var changed = false;
    input.territories.forEach(function (t) {
      // 巡回訪問用途は廃止。過去データに残っている指定は通常区域へ戻す。
      if (t.purpose === "patrol" || !Object.prototype.hasOwnProperty.call(PURPOSE_LABEL, t.purpose)) {
        t.purpose = "normal";
        changed = true;
      }
      if (!Array.isArray(t.adjacentIds)) { t.adjacentIds = []; changed = true; }
      if (!Array.isArray(t.history)) { t.history = []; changed = true; }
    });
    return changed;
  }

  // ---------- persistence: Supabase DBを真実のソースとし、localStorageはオフライン用キャッシュ ----------

  var pendingSyncTimer = null;
  var retrySyncTimer = null;
  var lastSyncFailed = false;
  var syncInFlight = false;
  var syncChain = Promise.resolve();
  var needsSyncAfterLoad = false;

  function loadLocalCache() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.territories) || !Array.isArray(parsed.groups)) return defaultState();
      if (normalizeState(parsed)) {
        needsSyncAfterLoad = true;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
      }
      return parsed;
    } catch (e) { return defaultState(); }
  }

  function persistLocalCache() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function showOfflineBanner(show) {
    var el = document.getElementById("offlineBanner");
    if (el) el.classList.toggle("show", !!show);
  }

  function nowTimeLabel() {
    var d = new Date();
    return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }

  function setSyncStatus(text) {
    var el = document.getElementById("syncStatus");
    if (el) el.textContent = text;
  }

  async function loadInitialState() {
    try {
      var res = await apiPost({ action: "getTerritoryState" });
      if (!res || !res.ok || !Array.isArray(res.groups) || !Array.isArray(res.territories)) {
        throw new Error("invalid_response");
      }
      var loaded = { groups: res.groups, territories: res.territories, setupDismissed: !!res.setupDismissed };
      if (normalizeState(loaded)) needsSyncAfterLoad = true;
      state = loaded;
      persistLocalCache();
      showOfflineBanner(false);
      setSyncStatus("最終保存 " + nowTimeLabel());
      return loaded;
    } catch (e) {
      showOfflineBanner(true);
      setSyncStatus("オフラインキャッシュを表示中です");
      return loadLocalCache();
    }
  }

  var state = await loadInitialState();
  document.documentElement.classList.remove("area-auth-pending");
  var ui = {
    activePage: "dashboard",
    territoryFilter: "all",
    assignGroupId: state.groups[0] ? state.groups[0].id : null,
    manualActivateId: null,
    assignmentEditId: null,
    adjSelected: 1,
    showAssignmentProposal: false
  };

  var AREA_NAV_GROUPS = [
    { label: "運用", ids: ["dashboard", "territories"] },
    { label: "区域データ", ids: ["adjacency", "pools", "groups"] },
    { label: "保守", ids: ["backup"] }
  ];
  var AREA_NAV_ITEMS = {
    dashboard: { title: "区域の現況", detail: "保持数・期限・回収待ち", icon: "⌂", iconBg: "var(--blue-l)", iconColor: "var(--blue)" },
    territories: { title: "区域一覧・割当操作", detail: "割当・編集・回収", icon: "📋", iconBg: "var(--blue-l)", iconColor: "var(--blue)" },
    adjacency: { title: "隣接関係", detail: "区域どうしの隣接を登録", icon: "🗺", iconBg: "var(--purple-l)", iconColor: "var(--purple)" },
    pools: { title: "プール管理", detail: "合同奉仕・企画用の確保", icon: "📦", iconBg: "var(--teal-l)", iconColor: "var(--teal)" },
    groups: { title: "グループ管理", detail: "グループ・目標保持数", icon: "👥", iconBg: "var(--green-l)", iconColor: "var(--green)" },
    backup: { title: "バックアップ", detail: "書き出し・読み込み・初期化", icon: "💾", iconBg: "var(--amber-l)", iconColor: "var(--amber)" }
  };

  function buildSyncPayload() {
    return { action: "saveTerritoryState", groups: state.groups, territories: state.territories, setupDismissed: state.setupDismissed };
  }

  // syncState()は成功/失敗をboolean(Promise)で返す。importBackup/resetAllなど即時同期が要る箇所から
  // await して結果判定できるようにしている。
  // 複数呼び出しはsyncChainで直列化し、必ず「前回の送信が完了してから、その時点最新のstateを送る」
  // 順序を保つ（そうしないと、遅延した古いリクエストが後から届いて新しい保存を上書きしうる）。
  function syncState() {
    var run = syncChain.then(doSyncOnce);
    syncChain = run.catch(function () {});
    return run;
  }

  async function doSyncOnce() {
    syncInFlight = true;
    setSyncStatus("保存中…");
    try {
      var res = await apiPost(buildSyncPayload());
      if (!res || res.ok !== true) throw new Error("invalid_response");
      lastSyncFailed = false;
      clearTimeout(retrySyncTimer);
      retrySyncTimer = null;
      setSyncStatus("最終保存 " + nowTimeLabel());
      return true;
    } catch (e) {
      lastSyncFailed = true;
      setSyncStatus("保存に失敗しました（自動的に再試行します）");
      scheduleRetry();
      return false;
    } finally {
      syncInFlight = false;
    }
  }

  // 失敗時のフォールバック再試行。visibilitychangeで再表示された時にも再試行するが、
  // タブを表示したまま何も編集せず放置された場合に備え、一定間隔でも自動的に再送する。
  function scheduleRetry() {
    clearTimeout(retrySyncTimer);
    retrySyncTimer = setTimeout(function () {
      retrySyncTimer = null;
      if (lastSyncFailed) syncState();
    }, 15000);
  }

  function scheduleSync() {
    clearTimeout(pendingSyncTimer);
    pendingSyncTimer = setTimeout(function () {
      pendingSyncTimer = null;
      syncState();
    }, 500);
  }

  // ページ離脱時（タブ非表示・実際に閉じる）に保留中のデバウンス保存を取りこぼさないよう、
  // keepalive付きfetchで即時送信する。apiPost()はkeepaliveを渡せないため専用に組み立てる。
  // sendBeacon()はカスタムヘッダー（セッショントークン）を送れないため使わない。
  function sendSyncKeepalive() {
    try {
      var headers = { "Authorization": "Bearer " + ANON_KEY, "Content-Type": "application/json" };
      var token = typeof pwgwsGetSessionToken === "function" ? pwgwsGetSessionToken() : "";
      if (token) headers["X-PWGWS-Session"] = token;
      fetch(API_URL, { method: "POST", keepalive: true, headers: headers, body: JSON.stringify(buildSyncPayload()) });
    } catch (e) {}
  }

  function flushPendingSync() {
    if (pendingSyncTimer === null) return;
    clearTimeout(pendingSyncTimer);
    pendingSyncTimer = null;
    sendSyncKeepalive();
  }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      flushPendingSync();
    } else if (lastSyncFailed) {
      syncState();
    }
  });
  window.addEventListener("pagehide", flushPendingSync);

  function saveState() {
    persistLocalCache();
    scheduleSync();
  }

  if (needsSyncAfterLoad) {
    needsSyncAfterLoad = false;
    syncState();
  }

  function esc(s) {
    return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function localISODate(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function todayISO() { return localISODate(new Date()); }

  function addMonths(iso, months) {
    var d = new Date(iso + "T00:00:00");
    var day = d.getDate();
    d.setMonth(d.getMonth() + months);
    if (d.getDate() < day) d.setDate(0);
    return localISODate(d);
  }

  function daysBetween(fromISO, toISO) {
    var a = new Date(fromISO + "T00:00:00");
    var b = new Date(toISO + "T00:00:00");
    return Math.round((b - a) / 86400000);
  }

  function fmtDate(iso) {
    if (!iso) return "—";
    var p = iso.split("-");
    return p[0].slice(2) + "/" + p[1] + "/" + p[2];
  }

  function findTerritory(id) {
    id = Number(id);
    for (var i = 0; i < state.territories.length; i++) if (state.territories[i].id === id) return state.territories[i];
    return null;
  }
  function findGroup(id) {
    for (var i = 0; i < state.groups.length; i++) if (state.groups[i].id === id) return state.groups[i];
    return null;
  }
  function groupName(id) { var g = findGroup(id); return g ? g.name : "未割当"; }
  function activeTerritories() { return state.territories.filter(function (t) { return t.status === "active"; }); }
  // id -> currentGroupId のマップ。同一グループ内の隣接は許容し、別グループとの隣接のみを競合とみなすため、
  // どのグループが使用中かを判定できるようにしている。
  function activeGroupMap() {
    var m = {};
    activeTerritories().forEach(function (t) { m[t.id] = t.currentGroupId; });
    return m;
  }
  function isAdjacentToActive(territory, groupMap, targetGroupId) {
    return isAdjacentToGroupMap(territory, groupMap, targetGroupId);
  }
  function isAdjacentToGroupMap(territory, groupMap, targetGroupId) {
    var conflict = false;
    function isOtherGroup(id) {
      return Object.prototype.hasOwnProperty.call(groupMap, id) && groupMap[id] !== targetGroupId;
    }
    territory.adjacentIds.forEach(function (aid) { if (isOtherGroup(aid)) conflict = true; });
    state.territories.forEach(function (t) {
      if (isOtherGroup(t.id) && t.adjacentIds.indexOf(territory.id) !== -1) conflict = true;
    });
    return conflict;
  }

  function buildAssignmentProposal() {
    var activeMap = activeGroupMap();
    var groups = state.groups.map(function (g) {
      var currentCount = state.territories.filter(function (t) {
        return t.status === "active" && t.currentGroupId === g.id;
      }).length;
      return {
        id: g.id,
        name: g.name,
        currentCount: currentCount,
        targetCount: Math.max(0, Number(g.targetActiveCount) || 0),
        need: Math.max(0, (Number(g.targetActiveCount) || 0) - currentCount)
      };
    });
    var order = groups.filter(function (g) { return g.need > 0; }).slice();
    var plannedMap = {};
    var plan = {};
    var searchNodes = 0;
    var searchLimit = 100000;

    function mergedMap() {
      var m = {};
      Object.keys(activeMap).forEach(function (id) { m[id] = activeMap[id]; });
      Object.keys(plannedMap).forEach(function (id) { m[id] = plannedMap[id]; });
      return m;
    }
    function candidatesFor(groupId) {
      var map = mergedMap();
      return state.territories.filter(function (t) {
        return t.status === "stock" && t.purpose === "normal" &&
          !Object.prototype.hasOwnProperty.call(plannedMap, t.id) &&
          !isAdjacentToGroupMap(t, map, groupId);
      }).sort(function (a, b) {
        return a.adjacentIds.length - b.adjacentIds.length || a.id - b.id;
      });
    }
    function chooseForGroup(item, candidates, start, selected, orderIndex) {
      if (selected.length === item.need) {
        plan[item.id] = selected.slice();
        if (searchGroup(orderIndex + 1)) return true;
        delete plan[item.id];
        return false;
      }
      var remaining = item.need - selected.length;
      if (candidates.length - start < remaining || searchNodes >= searchLimit) return false;
      var map = mergedMap();
      for (var i = start; i <= candidates.length - remaining; i++) {
        var t = candidates[i];
        if (isAdjacentToGroupMap(t, map, item.id)) continue;
        searchNodes++;
        plannedMap[t.id] = item.id;
        selected.push(t.id);
        if (chooseForGroup(item, candidates, i + 1, selected, orderIndex)) return true;
        selected.pop();
        delete plannedMap[t.id];
        if (searchNodes >= searchLimit) return false;
      }
      return false;
    }
    function searchGroup(index) {
      if (index >= order.length) return true;
      var item = order[index];
      return chooseForGroup(item, candidatesFor(item.id), 0, [], index);
    }

    // 候補が少ないグループから決めることで、全体の割当案を見つけやすくする。
    order.sort(function (a, b) {
      return candidatesFor(a.id).length - candidatesFor(b.id).length || b.need - a.need;
    });
    var complete = searchGroup(0);
    var totalNeed = groups.reduce(function (sum, g) { return sum + g.need; }, 0);
    var totalSuggested = Object.keys(plan).reduce(function (sum, gid) { return sum + plan[gid].length; }, 0);
    return {
      groups: groups.map(function (g) {
        return {
          name: g.name,
          currentCount: g.currentCount,
          targetCount: g.targetCount,
          need: g.need,
          suggestedIds: plan[g.id] || []
        };
      }),
      totalNeed: totalNeed,
      totalSuggested: totalSuggested,
      complete: complete && totalSuggested === totalNeed,
      searchLimitReached: searchNodes >= searchLimit
    };
  }

      return '<div class="card tile"><span class="tl">' + esc(g.name) + '</span><span class="tv">' + count + " / " + g.targetActiveCount + '</span><span class="' + subCls + '">' + subText + "</span></div>";

    var pending = state.territories.filter(function (t) { return t.status === "pending"; }).length;
    var joint = state.territories.filter(function (t) { return t.purpose === "joint"; }).length;
    var campaign = state.territories.filter(function (t) { return t.purpose === "campaign"; }).length;

    var poolTiles = '<div class="card tile"><span class="tl">通常ストック</span><span class="tv">' + stock + '</span><span class="ts">すぐ割当可能</span></div>' +
      '<div class="card tile"><span class="tl">回収待ち</span><span class="tv">' + pending + '</span><span class="ts">回収完了日の入力待ち</span></div>' +
      '<div class="card tile"><span class="tl">合同奉仕確保</span><span class="tv">' + joint + '</span></div>' +
      '<div class="card tile"><span class="tl">キャンペーン確保</span><span class="tv">' + campaign + '</span></div>';

    var due = activeTerritories().map(function (t) {
      var rd = t.dueDate ? daysBetween(todayISO(), t.dueDate) : 9999;
      return { t: t, rd: rd };
    }).filter(function (x) { return x.rd <= 21; }).sort(function (a, b) { return a.rd - b.rd; });

    var dueRows = due.length ? due.map(function (x) {
      var badge = x.rd < 0 ? '<span class="chip critical">期限超過 ' + (-x.rd) + "日</span>" : '<span class="chip pending">残り' + x.rd + "日</span>";
      return '<tr><td class="cell-main" data-label="区域"><span class="pack">' + x.t.id + '</span></td><td data-label="グループ">' + esc(groupName(x.t.currentGroupId)) + '</td><td data-label="開始日">' + fmtDate(x.t.assignedDate) + '</td><td data-label="期限">' + fmtDate(x.t.dueDate) + '</td><td data-label="状態">' + badge + "</td></tr>";
    }).join("") : '<tr class="row-empty"><td colspan="5" class="empty-note">期限が近い区域はありません</td></tr>';

    var pendingList = state.territories.filter(function (t) { return t.status === "pending"; });
    var pendingRows = pendingList.length ? pendingList.map(function (t) {
      return '<button type="button" class="area-next-row" onclick="openModal(\'territories\');setTerritoryFilter(\'pending\')">' +
        '<span class="area-next-id">区域 ' + t.id + '</span><span class="area-next-copy"><b>' + esc(groupName(t.currentGroupId)) + '</b><small>' + fmtDate(t.assignedDate) + 'から割当中</small></span>' +
        '<span class="chip pending">回収待ち</span><span class="area-next-link">回収処理へ ›</span></button>';
    }).join("") : '<div class="area-next-empty">回収待ちの区域はありません。</div>';

    var banner = state.setupDismissed ? "" :
      '<div class="banner" style="margin-bottom:16px"><span>&#9888;</span><div>' +
      "<b>初期セットアップの案内：</b> 全区域はいったん「ストック」で読み込まれています。現在すでに使用中の区域は" +
      '「区域一覧・割当操作」から <b>割当中に設定</b> してください。また「隣接関係」で区域どうしの隣接を登録すると、' +
      "新規割当時に自動でチェックされます。 " +
      '<a href="#" onclick="dismissSetup();return false;">この案内を閉じる</a></div></div>';

    return '<div class="pagehead"><span class="eyebrow">区域割り当て</span><h1>区域の現況</h1><p>保持数、期限、回収待ちの区域を確認し、作業へ進みます。</p></div>' +
      '<nav class="area-page-nav dashboard-area-nav" aria-label="区域の作業">' + renderAreaNav("dashboard") + '</nav>' +
      banner +
      '<div class="stack">' +
      '<div class="grid cols-4 area-dashboard-metrics" aria-label="区域の状態"><div class="card tile"><span class="tl">割当中</span><span class="tv">' + active + '</span><span class="ts">使用中の区域</span></div>' +
      '<div class="card tile metric-pending"><span class="tl">回収待ち</span><span class="tv">' + pending + '</span><span class="ts">回収完了日の入力待ち</span></div>' +
      '<div class="card tile"><span class="tl">通常ストック</span><span class="tv">' + stock + '</span><span class="ts">新規割当に使用可能</span></div>' +
      '<div class="card tile"><span class="tl">全区域</span><span class="tv">' + total + '</span><span class="ts">区域データの合計</span></div></div>' +
      '<section class="card area-next-action"><div class="section-title"><span>次の処理</span><button type="button" class="btn small" onclick="openModal(\'territories\');setTerritoryFilter(\'pending\')">回収待ち一覧を開く</button></div>' + pendingRows + '</section>' +
      '<div><div class="section-title">グループ別 保持数</div><div class="grid cols-4">' + groupTiles + "</div></div>" +
      '<div><div class="section-title">プール状況</div><div class="grid cols-4">' + poolTiles + "</div></div>" +
      '<div class="card"><div class="section-title">期限が近い区域（21日以内）</div><div class="table-wrap"><table><thead><tr><th>区域</th><th>グループ</th><th>開始日</th><th>期限</th><th>状態</th></tr></thead><tbody>' + dueRows + "</tbody></table></div></div>" +
      "</div>";
  }

  function renderAssignmentProposal() {
    if (!ui.showAssignmentProposal) return "";
    var proposal = buildAssignmentProposal();
    var summary = proposal.complete
      ? "現在の割当を維持したまま、目標数まで隣接条件を満たせる案です。"
      : "全グループ分の案を作成できませんでした。隣接関係・確保用途・目標保持数を確認してください。";
    var rows = proposal.groups.map(function (g) {
      var status = g.need === 0
        ? '<span class="chip good">目標達成</span>'
        : g.suggestedIds.length === g.need
          ? '<span class="chip good">提案あり</span>'
          : '<span class="chip pending">候補不足</span>';
      var ids = g.suggestedIds.length
        ? g.suggestedIds.map(function (id) { return '<span class="pack">' + id + '</span>'; }).join("")
        : '<span class="proposal-meta">' + (g.need === 0 ? "追加割当なし" : "割当可能な区域が見つかりません") + '</span>';
      return '<div class="proposal-row"><div class="proposal-row-head"><span class="proposal-group">' + esc(g.name) +
        '</span><span class="proposal-meta">現在 ' + g.currentCount + ' / 目標 ' + g.targetCount + '　' + status +
        '</span></div><div class="proposal-ids"><span>提案区域：</span>' + ids + '</div></div>';
    }).join("");
    if (proposal.searchLimitReached) summary += " 検索量が多いため、表示案は一部となる場合があります。";
    return '<div class="card proposal-card"><div class="proposal-head"><div><div class="proposal-title">隣接条件を考慮した割当案</div>' +
      '<p class="proposal-desc">通常ストックから、別グループの使用区域と隣接しない組み合わせを提案します。同一グループ内の隣接は許容します。</p></div>' +
      '<button class="btn small" onclick="generateAssignmentProposal()">再計算</button></div>' +
      '<div class="proposal-list">' + rows + '</div><p class="proposal-note">' + summary +
      ' 下の区域一覧で内容を確認し、「割当する」を押して確定してください。</p></div>';
  }

  // ---- modal bodies ----
  function renderModals() {
    ["territories", "adjacency", "pools", "groups", "backup"].forEach(function (id) {
      var ov = document.getElementById("ov-" + id);
      // 旧DOMは互換性のため残す。各操作は #main 内に描画する。
      if (ov) ov.classList.remove("show");
    });
  }

  var MODAL_BODY = {
    territories: function () {
      var filters = [
        { id: "all", label: "すべて" },
        { id: "stock", label: "ストック" },
        { id: "active", label: "割当中" },
        { id: "pending", label: "回収待ち" }
      ];
      var tabs = filters.map(function (f) {
        return '<button class="tb' + (ui.territoryFilter === f.id ? " on" : "") + '" onclick="setTerritoryFilter(\'' + f.id + '\')">' + f.label + "</button>";
      }).join("");

      var groupMap = activeGroupMap();
      var groupOpts = state.groups.map(function (g) {
        return '<option value="' + g.id + '"' + (ui.assignGroupId === g.id ? " selected" : "") + '>' + esc(g.name) + "</option>";
      }).join("");

      var list = state.territories.filter(function (t) {
        return ui.territoryFilter === "all" || t.status === ui.territoryFilter;
      });

      var rows = list.map(function (t) {
        var manualRow = "";
        if (ui.manualActivateId === t.id) {
          manualRow = '<tr class="row-form"><td colspan="7"><div class="field-row">' +
            '<label>グループ<select id="manualGroupSelect">' + groupOpts + "</select></label>" +
            '<label>開始日<input type="date" id="manualDateInput" value="' + todayISO() + '"></label>' +
            '<button class="btn btn-p small" onclick="confirmManualActivate(' + t.id + ')">設定する</button>' +
            '<button class="btn small" onclick="cancelManualActivate()">取消</button>' +
            "</div></td></tr>";
        }

        var action;
        var editRow = "";
        if (ui.assignmentEditId === t.id && (t.status === "active" || t.status === "pending")) {
          var editGroupOpts = state.groups.map(function (g) {
            return '<option value="' + g.id + '"' + (t.currentGroupId === g.id ? " selected" : "") + '>' + esc(g.name) + "</option>";
          }).join("");
          var replacementOpts = state.territories.filter(function (x) {
            return x.status === "stock" && x.purpose === "normal";
          }).map(function (x) {
            return '<option value="' + x.id + '">区域 ' + x.id + (x.area ? "（" + esc(x.area) + "）" : "") + "</option>";
          }).join("");
          var editConflict = t.status === "active" && isAdjacentToActive(t, groupMap, t.currentGroupId);
          editRow = '<tr class="row-form"><td colspan="7"><div class="field-row" style="align-items:flex-end">' +
            '<label>割当先グループ<select id="editGroupSelect_' + t.id + '" onchange="updateAssignmentEditConflict(' + t.id + ', this.value)">' + editGroupOpts + "</select></label>" +
            '<label>開始日<input type="date" id="editDateInput_' + t.id + '" value="' + (t.assignedDate || todayISO()) + '"></label>' +
            '<label>差し替え区域<select id="editReplacementSelect_' + t.id + '"><option value="">現在の区域のまま</option>' + replacementOpts + '</select></label>' +
            '<span id="editConflict_' + t.id + '" class="chip pending assignment-edit-conflict' + (editConflict ? ' show' : '') + '">別グループと隣接</span>' +
            '<button class="btn btn-p small" onclick="saveAssignmentEdit(' + t.id + ')">保存</button>' +
            '<button class="btn small" onclick="cancelAssignmentEdit()">取消</button>' +
            '</div></td></tr>';
        }
        if (t.status === "stock" && t.purpose === "normal") {
          var conflict = isAdjacentToActive(t, groupMap, ui.assignGroupId);
          action = '<div class="field-row">' +
            (conflict ? '<span class="chip pending">別グループと隣接</span>' : '') +
            '<input class="inp-w122" type="date" id="assignDate_' + t.id + '" value="' + todayISO() + '">' +
            '<button class="btn btn-p small" onclick="assignTerritory(' + t.id + ')">割当する</button>' +
            '<button class="btn small" onclick="markActiveManually(' + t.id + ')">手動設定</button>' +
            "</div>";
        } else if (t.status === "stock") {
          action = '<span class="chip plain">確保中</span>';
        } else if (t.status === "active") {
          action = '<div class="field-row"><button class="btn small" onclick="startAssignmentEdit(' + t.id + ')">割当を編集</button>' +
            '<button class="btn small" onclick="startReturn(' + t.id + ')">回収待ちへ</button>' +
            '<button class="btn btn-d small" onclick="cancelAssignment(' + t.id + ')">割当を取消</button></div>';
        } else {
          action = '<div class="field-row">' +
            '<input class="inp-w122" type="date" id="returnDate_' + t.id + '" value="' + todayISO() + '">' +
            '<button class="btn small" onclick="startAssignmentEdit(' + t.id + ')">割当を編集</button>' +
            '<button class="btn btn-p small" onclick="completeReturn(' + t.id + ')">回収完了</button>' +
            '<button class="btn small" onclick="undoReturn(' + t.id + ')">戻す</button>' +
            '<button class="btn btn-d small" onclick="cancelAssignment(' + t.id + ')">割当を取消</button>' +
            "</div>";
        }

        return '<tr><td class="cell-main" data-label="区域"><span class="pack">' + t.id + '</span><span class="sm-only">' + statusChip(t) + " " + purposeChip(t.purpose) + "</span></td>" +
          '<td class="cell-hide-sm" data-label="状態">' + statusChip(t) + " " + purposeChip(t.purpose) + "</td>" +
          '<td data-label="グループ">' + esc(groupName(t.currentGroupId)) + "</td>" +
          '<td data-label="開始日">' + fmtDate(t.assignedDate) + '</td><td data-label="期限">' + fmtDate(t.dueDate) + "</td>" +
          '<td data-label="隣接">' + t.adjacentIds.length + "件</td>" +
          '<td class="cell-actions" data-label="操作">' + action + "</td></tr>" + editRow + manualRow;
      }).join("");

      if (!list.length) rows = '<tr class="row-empty"><td colspan="7" class="empty-note">該当する区域はありません</td></tr>';

      var proposalButton = ui.showAssignmentProposal ? "割当案を再計算" : "隣接を考慮して割当案を作成";
      return '<div class="field-row" style="justify-content:space-between;align-items:center;margin-bottom:12px"><span style="color:var(--ink2);font-size:12px">割当前に候補を確認できます。割当中・回収待ちは各行の「割当を編集」から修正できます。</span>' +
        '<button class="btn btn-p small" onclick="generateAssignmentProposal()">' + proposalButton + '</button></div>' +
        renderAssignmentProposal() +
        '<div class="tabs">' + tabs + "</div>" +
        '<div class="field-row" style="margin-bottom:12px"><label>新規割当の割当先グループ<select onchange="selectAssignGroup(this.value)">' + groupOpts + "</select></label></div>" +
        '<div class="table-wrap"><table><thead><tr><th>区域</th><th>状態</th><th>グループ</th><th>開始日</th><th>期限</th><th>隣接</th><th>操作</th></tr></thead><tbody>' + rows + "</tbody></table></div>";
    },

    adjacency: function () {
      var t = findTerritory(ui.adjSelected);
      var picker = state.territories.map(function (x) {
        return '<button class="btn small' + (ui.adjSelected === x.id ? " btn-p" : "") + '" onclick="toggleAdjSelect(' + x.id + ')">' + x.id + "</button>";
      }).join(" ");
      var grid = state.territories.map(function (x) {
        if (x.id === t.id) return '<div class="adj-cell self">' + x.id + "</div>";
        var on = t.adjacentIds.indexOf(x.id) !== -1;
        return '<div class="adj-cell' + (on ? " on" : "") + '" onclick="toggleAdjacent(' + x.id + ')">' + x.id + "</div>";
      }).join("");
      return '<p style="margin:0 0 10px;color:var(--ink2);font-size:12.5px">区域番号を選び、実際に隣接する区域をクリックしてON/OFFします。一方を設定すると自動で双方向に反映されます。</p>' +
        '<div class="banner" style="margin-bottom:14px;background:var(--blue-l);color:var(--blue);border-color:color-mix(in srgb, var(--blue) 35%, transparent)"><span>&#9989;</span><div>' +
        '<b>確認済みの隣接データ：</b> 2026-07-30時点で目視確認済みの隣接関係（区域1〜41）を用意しています。新規・未設定のブラウザでは自動的にこの内容が初期値になります。現在の登録をこの確認済みデータで上書きしたい場合は下のボタンから適用できます。' +
        '<div style="margin-top:8px"><button class="btn small" onclick="applyVerifiedAdjacency()">確認済みデータを適用（現在の登録を上書き）</button></div></div></div>' +
        '<div class="section-title">区域を選択</div><div class="field-row" style="flex-wrap:wrap;margin-bottom:16px">' + picker + "</div>" +
        '<div class="section-title">区域 ' + t.id + ' の隣接区域（' + t.adjacentIds.length + '件選択中）</div><div class="adj-grid">' + grid + "</div>";
    },

    pools: function () {
      var rows = state.territories.map(function (t) {
        var opts = Object.keys(PURPOSE_LABEL).map(function (k) {
          return '<option value="' + k + '"' + (t.purpose === k ? " selected" : "") + ">" + PURPOSE_LABEL[k] + "</option>";
        }).join("");
        return '<tr><td class="cell-main" data-label="区域"><span class="pack">' + t.id + '</span><span class="sm-only">' + statusChip(t) + '</span></td><td class="cell-hide-sm" data-label="状態">' + statusChip(t) + '</td><td data-label="用途"><select class="inp-fill" onchange="setPurpose(' + t.id + ', this.value)">' + opts + "</select></td>" +
          '<td data-label="地域"><input class="inp-fill inp-w120" type="text" value="' + esc(t.area) + '" placeholder="宇多津 / 坂出" onchange="setArea(' + t.id + ', this.value)"></td>' +
          '<td data-label="メモ"><input class="inp-fill inp-w160" type="text" value="' + esc(t.note) + '" placeholder="メモ" onchange="setNote(' + t.id + ', this.value)"></td></tr>';
      }).join("");
      return '<p style="margin:0 0 12px;color:var(--ink2);font-size:12.5px">通常割当以外に確保しておく区域（合同奉仕・キャンペーン確保）を指定します。確保中の区域は新規割当の候補から除外されます。</p>' +
        '<div class="table-wrap"><table><thead><tr><th>区域</th><th>状態</th><th>用途</th><th>地域</th><th>メモ</th></tr></thead><tbody>' + rows + "</tbody></table></div>";
    },

    groups: function () {
      var rows = state.groups.map(function (g) {
        var count = state.territories.filter(function (t) { return t.status === "active" && t.currentGroupId === g.id; }).length;
        return '<tr><td data-label="グループ名"><input class="inp-fill inp-w110" type="text" value="' + esc(g.name) + '" onchange="updateGroupName(\'' + g.id + '\', this.value)"></td>' +
          '<td data-label="目標"><input class="inp-w60" type="number" min="0" value="' + g.targetActiveCount + '" onchange="updateGroupTarget(\'' + g.id + '\', this.value)"></td>' +
          '<td data-label="現在">' + count + "件</td>" +
          '<td class="cell-actions"><button class="btn btn-d small" onclick="removeGroup(\'' + g.id + '\')">削除</button></td></tr>';
      }).join("");
      return '<p style="margin:0 0 12px;color:var(--ink2);font-size:12.5px">8月の3グループ体制への移行時は、ここでグループの改名・削除・追加や目標保持数の変更ができます。</p>' +
        '<div class="table-wrap"><table><thead><tr><th>グループ名</th><th>目標</th><th>現在</th><th></th></tr></thead><tbody>' + rows + "</tbody></table></div>";
    },

    backup: function () {
      return '<div class="stack">' +
        '<div class="card stack"><div class="section-title">書き出し</div><p style="margin:0;color:var(--ink2);font-size:12px">現在のデータをJSONファイルとして保存します。</p><button class="btn btn-p" onclick="exportBackup()">JSONを書き出す</button></div>' +
        '<div class="card stack"><div class="section-title">読み込み</div><p style="margin:0;color:var(--ink2);font-size:12px">以前のバックアップで現在のデータを上書きします。</p><input type="file" accept="application/json" onchange="importBackup(this)"></div>' +
        '<div class="card stack"><div class="section-title">初期化</div><p style="margin:0;color:var(--ink2);font-size:12px">全区域をストックに戻し、履歴を消去します。</p><button class="btn btn-d" onclick="resetAll()">全データをリセット</button></div>' +
        "</div>";
    }
  };

  render();
  })();
});
</script>

</body>
</html>
